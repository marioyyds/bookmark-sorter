<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>RecallFlow - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1>RecallFlow · AI 设置</h1>
    <p class="sub">配置 DeepSeek 与 RecallFlow 行为</p>
  </header>

  <main>
    <section class="card">
      <h2><span class="ico">🔑</span> DeepSeek API</h2>
      <label class="field">
        <span class="field-label">API Key</span>
        <div class="input-row">
          <input id="api-key" type="password" placeholder="sk-..." autocomplete="off">
          <button id="toggle-key" class="icon-btn" title="显示/隐藏">👁</button>
        </div>
        <span class="hint">在 platform.deepseek.com 申请，仅保存在本地浏览器</span>
      </label>
      <label class="field">
        <span class="field-label">模型</span>
        <div class="input-row">
          <input id="model" type="text" placeholder="deepseek-chat" list="model-list">
          <datalist id="model-list">
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="deepseek-reasoner">deepseek-reasoner</option>
          </datalist>
        </div>
        <span class="hint">deepseek-chat 通用 / deepseek-reasoner 深度推理</span>
      </label>
      <label class="field">
        <span class="field-label">API 地址</span>
        <input id="base-url" type="text" placeholder="https://api.deepseek.com">
        <span class="hint">一般无需修改</span>
      </label>
    </section>

    <section class="card">
      <h2><span class="ico">🤖</span> RecallFlow 行为</h2>
      <label class="field switch-field">
        <span class="field-label">RAG 知识库检索</span>
        <span class="hint">回答时自动把相关知识库条目作为上下文，让 AI 基于你的收藏回答</span>
        <input id="rag-enabled" type="checkbox" class="switch">
      </label>
      <label class="field switch-field">
        <span class="field-label">结合整页内容</span>
        <span class="hint">回答时不仅看选中的文字，还把当前网页正文作为上下文一起发给 AI</span>
        <input id="page-context" type="checkbox" class="switch">
      </label>
      <label class="field switch-field">
        <span class="field-label">Agent 工具执行前确认</span>
        <span class="hint">新增/删除知识库、打开网页、抓取外部网页及 MCP 工具调用前，请先确认。</span>
        <input id="tool-approval" type="checkbox" class="switch">
      </label>
      <label class="field">
        <span class="field-label">翻译目标语言</span>
        <input id="target-lang" type="text" placeholder="中文">
        <span class="hint">划词翻译的目标语言，如 中文 / English / 日本語</span>
      </label>
    </section>

    <section class="card">
      <h2><span class="ico">🔌</span> MCP 服务器（Agent 工具扩展）</h2>
      <span class="hint">配置远程 MCP 服务器（Streamable HTTP），Agent 会自动连接并加载其工具（工具名以 mcp__ 开头）。<b>需把各服务器域名加入 manifest.json 的 host_permissions</b>，否则无法跨域访问。</span>
      <div id="mcp-list" class="mcp-list"></div>
      <button id="mcp-add" class="ghost-btn" type="button">+ 添加服务器</button>
    </section>

    <section class="card">
      <h2><span class="ico">⚡</span> 对话快捷语句</h2>
      <span class="hint">显示在 AI 对话框输入区上方，点击后直接发送。每行一条，最多 12 条。</span>
      <textarea id="quick-prompts" rows="5" placeholder="总结全文&#10;翻译成中文&#10;解释这段内容"></textarea>
    </section>

    <div class="actions">
      <button id="save-btn" class="primary">保存设置</button>
      <span id="status" class="status"></span>
    </div>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
